name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the project claims to support, and a current release.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile
        run: python -m compileall -q reminder_bot.py setup_wizard.py reminderbot

      - name: Lint
        run: python -m pyflakes reminder_bot.py setup_wizard.py reminderbot tests

      - name: Test
        run: python -m pytest -q

      - name: Check the shell scripts parse
        run: bash -n install-service.sh uninstall-service.sh
